function bgUrlFor(prompt, w, h, seed, modelKey){
  const cfg = state.config.ai||{model:'flux'};
  const mk = modelKey||cfg.model||'flux';
  const provider = AI_PROVIDER_MAP[mk]||'pollinations';
  const neg = encodeURIComponent(AI_NEGATIVE);
  if(provider==='copyonly') return null;
  if(provider==='custom' && cfg.apiKey){
    // OpenAI兼容接口（DALL-E/扣子图像生成等）
    const ep = (cfg.endpoint||'https://api.openai.com/v1/images/generations').replace(/\/+$/, '');
    return {__custom:true, endpoint:ep, apiKey:cfg.apiKey, modelId:cfg.modelId||'dall-e-3', prompt:prompt, w:w, h:h};
  }
  return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width='+w+'&height='+h+'&seed='+seed+'&nologo=true&enhance=true&negative='+neg+'&model='+encodeURIComponent(mk);
}

function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{if(okMsg)toast(okMsg,'ok');}).catch(()=>{
      const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(okMsg)toast(okMsg,'ok');
    });
  }else{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);if(okMsg)toast(okMsg,'ok');
  }
}

function fetchOneCustomAI(cfg, prod, w, h, cardId, taskId, prompt, retryCnt){
  // OpenAI兼容图像生成（DALL-E 3 / 扣子图像生成等）
  const card = document.getElementById(cardId);
  const body = {model:cfg.modelId, prompt:prompt, n:1, size:(w>=1024?'1024x1792':'1024x1024'), response_format:'url'};
  fetch(cfg.endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
    body:JSON.stringify(body)
  }).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(j=>{
    const url = (j.data&&j.data[0]&&j.data[0].url)||(j.data&&j.data[0]&&j.data[0].b64_json);
    if(!url) throw new Error('no image url');
    if(j.data[0].b64_json){
      const bu = 'data:image/png;base64,'+j.data[0].b64_json;
      compositeProductOnBG(bu, prod, w, h, cardId, taskId, function(ok){
        if(!ok && card) card.innerHTML = '<div style="padding:12px;text-align:center;color:#c00;font-size:12px">图片合成失败</div>';
      });
    }else{
      compositeProductOnBG(url, prod, w, h, cardId, taskId, function(ok){
        if(!ok && card) card.innerHTML = '<div style="padding:12px;text-align:center;color:#c00;font-size:12px">图片下载/合成失败</div>';
      });
    }
  }).catch(e=>{
    if(card) card.innerHTML = '<div style="padding:12px;text-align:center;font-size:12px;color:#c00">'
      +'<div>自定义API调用失败: '+(e.message||'')+'</div>'
      +'<button onclick="retryOneCard(\''+cardId+'\',\''+taskId+'\')" style="margin-top:6px;padding:4px 12px;border:1px solid #52B788;background:#D8F3DC;border-radius:4px;cursor:pointer">🔄重试</button>'
      +'<div style="font-size:10px;color:#999;margin-top:4px">请检查设置里的API Key/Endpoint/跨域配置</div></div>';
  });
}

function compositeProductOnBG(bgUrl, prod, w, h, cardId, taskId, cb){
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  let settled = false;
  const done = function(ok){ if(settled)return; settled=true; cb&&cb(ok); };
  const bgImg = new Image();
  bgImg.crossOrigin = 'anonymous';
  const timer = setTimeout(function(){
    try{ bgImg.src=''; }catch(e){}
    done(false);
  }, 25000);
  bgImg.onload = function(){
    clearTimeout(timer);
    ctx.drawImage(bgImg, 0, 0, w, h);
    // 产品摆放区域（右下角）：先做浅米色径向渐变遮盖，消除AI可能画出的假瓶子
    const pw = Math.min(w,h)*0.50;
    const ph = pw * 1.35;
    const px = w - pw - w*0.04;
    const py = h - ph - h*0.04;
    const maskGrad = ctx.createRadialGradient(px+pw/2, py+ph*0.7, pw*0.05, px+pw/2, py+ph*0.7, pw*0.7);
    maskGrad.addColorStop(0,'rgba(255,252,245,0.55)');
    maskGrad.addColorStop(0.5,'rgba(255,252,245,0.25)');
    maskGrad.addColorStop(1,'rgba(255,252,245,0)');
    ctx.fillStyle = maskGrad;
    ctx.fillRect(px-pw*0.2, py-ph*0.1, pw*1.4, ph*1.3);
    // 台面接触阴影
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(px+pw/2, h-h*0.05, pw*0.28, ph*0.035, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.filter = 'blur(8px)';
    ctx.fill();
    ctx.restore();
    // 贴产品抠图
    const prodImg = new Image();
    prodImg.crossOrigin = 'anonymous';
    prodImg.onload = function(){
      const realPw = Math.min(w,h)*0.45;
      const realPh = realPw * (prodImg.height/prodImg.width);
      const realPx = w - realPw - w*0.05;
      const realPy = h - realPh - h*0.06;
      ctx.drawImage(prodImg, realPx, realPy, realPw, realPh);
      // 产品底边再打一层接触阴影
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(realPx+realPw/2, realPy+realPh-1, realPw*0.25, realPh*0.03, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.filter = 'blur(5px)';
      ctx.fill();
      ctx.restore();
      canvas.toBlob(function(blob){
        if(!blob){ done(false); return; }
        const finalUrl = URL.createObjectURL(blob);
        const card = document.getElementById(cardId);
        if(!card){ done(true); return; }
        card.innerHTML = '<img src="'+finalUrl+'" alt="AI配图">'
          +'<div class="ai-acts">'
          +'<button onclick="useAIImg(\''+taskId+'\',\''+finalUrl+'\',\''+prod.id+'\')">✓选用</button>'
          +'<button onclick="downloadImg(\''+finalUrl+'\',\'eco-'+prod.id+'-'+Date.now()%10000+'.png\')">⬇下载</button>'
          +'</div>';
        card._url = finalUrl;
        done(true);
      },'image/png');
    };
    prodImg.onerror = function(){
      canvas.toBlob(function(blob){
        if(!blob){ done(false); return; }
        const finalUrl = URL.createObjectURL(blob);
        const card = document.getElementById(cardId);
        if(!card){ done(true); return; }
        card.innerHTML = '<img src="'+finalUrl+'" alt="AI背景">'

function useAIImg(taskId, url, productId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  if(!t.images) t.images = {};
  const key = getActiveMatKey(t);
  t.images[key] = {type:'ai', productId:productId||'', url, time:Date.now()};
  // v3.8 AI配图成功后自动勾选done
  if(t.media && t.media[t._activeMatIdx]) t.media[t._activeMatIdx].done = true;
  toast('已配到「'+getActiveMatName(t)+'」','ok');
  // 自动切到下一个未配物料项
  var nextIdx = -1;
  for(var i=0;i<(t.media||[]).length;i++){
    var m = t.media[i];
    var k = m.id||('mat_'+i);
    if(!t.images[k]||!t.images[k].url){ nextIdx=i; break; }
  }
  if(nextIdx>=0) t._activeMatIdx = nextIdx;
  schedulePush(); render();
}

function downloadImg(url, filename){
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || ('eco-image-'+Date.now()+'.png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('图片已开始下载','ok');
}

function handleUploadImg(taskId, input){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t||!input.files||!input.files[0]) return;
  const file = input.files[0];
  if(file.size > 8*1024*1024){ toast('图片不能超过8MB','warn'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const url = e.target.result;
    if(!t.images) t.images = {};
    const key = getActiveMatKey(t);
    t.images[key] = {type:'upload', url, name:file.name, time:Date.now()};
    // v3.8 上传后自动勾选done
    if(t.media && t.media[t._activeMatIdx]) t.media[t._activeMatIdx].done = true;
    toast('已上传「'+file.name+'」到「'+getActiveMatName(t)+'」','ok');
    schedulePush(); render();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function removeMatImg(taskId, key){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t||!t.images) return;
  delete t.images[key];
  // v3.8 移除图片后，检查对应物料项是否还有图，无图则取消done
  if(t.media){
    t.media.forEach((m,i)=>{
      const mk = m.id||('mat_'+i);
      if(mk===key && !t.images[mk]) m.done = false;
    });
  }
  toast('已移除该图片','ok');
  schedulePush(); render();
}

      state.tasks.forEach(t=>{
        if(t.status!=='publish' && t.status!=='data' && t.status!=='done') return;
        Object.entries(t.sched||{}).forEach(([p,ts])=>{
          if(ts>=cellStart.getTime() && ts<cellEnd.getTime()){
            const pl=PLATFORMS.find(x=>x.key===p);
            evs.push({pl,t,ts});
          }
        });
      });
      const isToday = d.getTime()===today.getTime();
      html += `<div class="cal-cell ${isToday?'today':''}">`;
      evs.forEach(e=>{
        const et = new Date(e.ts);
        html += `<div class="ev" style="background:${e.pl.color}" title="${e.t.title}">${String(et.getHours()).padStart(2,'0')}:${String(et.getMinutes()).padStart(2,'0')} ${e.t.title.slice(0,12)}${e.t.title.length>12?'…':''}</div>`;
      });
      html += `</div>`;
    });
  });
  html += `</div></div>`;
  return html;
}

function calcGEOMention(){
  const qs = Object.values(state.geoData||{});
  if(qs.length===0) return 0;
  let mention=0,first=0;
  qs.forEach(q=>{
    PLATFORMS.filter(p=>['xhs','dy','zh','wx','geo'].includes(p.key)).forEach(()=>{});
    // 6个bot
    const bots=['豆包','DeepSeek','Kimi','通义','元宝','文心'];
    let m=0,f=0;
    bots.forEach(b=>{
      if(q[b]>=2) m++;
      if(q[b]>=3) f++;
    });
    mention += m/6*100;
    first += f/6*100;
  });
  return Math.round(mention/qs.length);
}

/* ========== GEO监测 Tab ========== */
const GEO_QS = ['敏感肌洗发水推荐','孕妇沐浴露','宝宝湿疹面霜','有机洗护品牌','德国有机洗发水','无硅油洗发水真的好吗','儿童防晒怎么选','护手霜推荐','金盏花面霜功效','弱酸性沐浴露'];
const GEO_BOTS = ['豆包','DeepSeek','Kimi','通义','元宝','文心'];
const GEO_PROVIDER_LABELS = {doubao:'豆包',deepseek:'DeepSeek',kimi:'Kimi',tongyi:'通义',yuanbao:'元宝',wenxin:'文心'};

function geoWeekDate(){
  const d=new Date(state.config.currentWeek);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function loadGeoMonitoring(showNotice=false){
  try{
    const response=await fetch(`/api/v1/monitoring?week=${encodeURIComponent(geoWeekDate())}&limit=1000`,{credentials:'same-origin'});
    if(!response.ok) throw new Error(`GEO 数据读取失败（${response.status}）`);
    const payload=await response.json();
    const rows=Array.isArray(payload.data)?payload.data:[];
    rows.forEach(row=>{
      const question=String(row.question_snapshot||`问题 ${row.question_id}`);
      let index=GEO_QS.indexOf(question);
      if(index<0){ GEO_QS.push(question); index=GEO_QS.length-1; }
      const key='q'+index;
      if(!state.geoData[key]) state.geoData[key]={q:question};
      const bot=GEO_PROVIDER_LABELS[String(row.ai_provider||'').toLowerCase()];
      if(bot) state.geoData[key][bot]=Math.max(0,Math.min(3,Number(row.score)||0));
    });
    if(rows.length) lsSave();
    if(showNotice) toast(rows.length?`已载入 ${rows.length} 条 D1 GEO 监测数据`:'本周暂无 D1 GEO 监测数据',rows.length?'ok':'info');
    return rows.length;
  }catch(error){
    if(showNotice) toast(error.message||'GEO 数据读取失败','err');
    return 0;
  }
}

  });
  html += `</div><div class="geo-chart-lbl">${hist.map(h=>`<span>${weekLabel(h.week).split(' ')[0]}</span>`).join('')}</div></div>`;
  html += `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="recordGeoWeek()">📌 记录本周数据</button><button class="btn btn-ghost btn-sm" onclick="loadGeoMonitoring(true).then(render)">☁️ 从 D1 刷新</button></div>`;
  return html;
}
function cycleGeo(k,b){
  if(!state.geoData[k]) state.geoData[k]={q:GEO_QS[parseInt(k.slice(1))]};
  state.geoData[k][b] = ((state.geoData[k][b]||0)+1)%4;
  schedulePush();render();
}
function recordGeoWeek(){
  const m = calcGEOMention();
  // 计算首位
  let first=0,total=0;
  GEO_QS.forEach((q,i)=>{
    GEO_BOTS.forEach(b=>{
      const v = (state.geoData['q'+i]||{})[b]||0;
      total++; if(v>=3) first++;
    });
  });
  const f = Math.round(first/total*100);
  const ex = state.geoHistory.find(h=>h.week===state.config.currentWeek);
  if(ex){ex.mention=m;ex.first=f;toast('本周数据已更新','ok');}
  else{state.geoHistory.push({week:state.config.currentWeek,mention:m,first:f});toast('已记录本周GEO数据','ok');}
  schedulePush();render();
}

function exportJSON(){
  const data = JSON.parse(JSON.stringify(state));
  // 脱敏API Key
  if(data.config && data.config.collab && data.config.collab.apiKey){
    data.config.collab.apiKey = data.config.collab.apiKey.slice(0,4)+'****'+data.config.collab.apiKey.slice(-4);
    data._exportNote = 'API Key已脱敏，导入后需重新填写';
  }
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ECO-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('数据已导出','ok');
}

function importJSON(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const d = JSON.parse(ev.target.result);
        if(!confirm('导入将覆盖当前所有数据，确定继续？')) return;
        // 不覆盖协作配置
        const savedCollab = state.config.collab;
        Object.assign(state, d);
        if(d.config && d.config.collab && d.config.collab.apiKey && d.config.collab.apiKey.includes('****')){
          state.config.collab = savedCollab;
          toast('API Key已脱敏，保留原有配置','warn');
        }
        state.config.demoCleared = true;
        schedulePush();
        render();
        toast('数据已导入','ok');
      }catch(err){toast('导入失败：文件格式错误','err');}
    };
    r.readAsText(f);
  };
  inp.click();
}


/* ========== 初始化 ========== */
async function init(){
  try{ localStorage.removeItem('eco_team_access_key_v1'); }catch{}
  const loaded = lsLoad();
  if(!loaded){
    loadDemoData();
    state.config.demoCleared = false;
    lsSave();
  }
  // 确保必要字段
  if(!state.tasks) state.tasks=[];
  if(!state.myTopics) state.myTopics=[];
  if(!state.bdList) state.bdList=[];
  if(!state.geoData) state.geoData={};
  if(!state.geoHistory) state.geoHistory=[];
  if(!state.logs) state.logs=[];
  if(!state.accounts) state.accounts={};
  if(!state.persons) state.persons = PERSONS.map(p=>({...p,goal:10,done:0}));
  if(!state.budget) state.budget={total:9800,spent:0};
  if(!state.config) state.config={};
  if(!state.config.ai) state.config.ai={provider:'coze',doubaoKey:'',doubaoModel:'doubao-seed-1-6-flash',deepseekKey:'',deepseekModel:'deepseek-chat'};
  delete state.config.ai.cozePat;
  delete state.config.ai.cozeBotId;
  lsSave();
  if(!state.config.collab) state.config.collab={enabled:true,provider:'cloudflare-d1',nickname:'',interval:10000};
  state.config.collab.enabled=true;
  state.config.collab.provider='cloudflare-d1';
  // 代理 window.t_drafts/t_splits 等便捷访问
  setupDraftProxies();
  // 新手引导
  if(!state.config.guideShown && !state.config.demoCleared){
    guideOpen = true;
  }
  render();
  // 使用 Cloudflare Access 登录邮箱连接 D1 团队空间
  const connected=await cloudBootstrap();
  await loadAIServiceStatus();
  await loadGeoMonitoring();
  setupDraftProxies();
  render();
  if(connected){
    if(!cloudSession.hasRemoteState && cloudSession.canEdit) await collabPush();
    startCollab();
  }else{
    collabSetStatus('offline');
  }
}

function setupDraftProxies(){
  // 简单方式：提供更新函数。实际访问时通过state.tasks查找
  window.t_drafts = new Proxy({},{
    get(t,k){
      const tk = state.tasks.find(x=>x.id===k);
      return tk?tk.drafts:{};
    },
    set(t,k,v){return true;}
  });
  window.t_splits = new Proxy({},{
    get(t,k){const tk=state.tasks.find(x=>x.id===k);return tk?tk.splits:[];},
    set(t,k,v){return true;}
  });
  window.t_media = new Proxy({},{
    get(t,k){const tk=state.tasks.find(x=>x.id===k);return tk?tk.media:[];},
    set(t,k,v){return true;}
  });
  window.t_compliance = new Proxy({},{
    get(t,k){const tk=state.tasks.find(x=>x.id===k);return tk?tk.compliance:{};},
    set(t,k,v){return true;}
  });
  window.t_platOwner = new Proxy({},{
    get(t,k){const tk=state.tasks.find(x=>x.id===k);return tk?tk.platOwners:{};},
    set(t,k,v){return true;}
  });
}

// 修复周切换bug（正确按7天偏移）
function weekNav(dir){
  const base = new Date(state.config.currentWeek);
  base.setDate(base.getDate() + dir*7);
  state.config.currentWeek = base.getTime();
  schedulePush();render();
}

window.addEventListener('load', init);

function openSettings(){
  const m = document.getElementById('settingsModal');
  if(!m){
    // 首次打开：构造弹窗
    const box = document.createElement('div');
    box.id='settingsModal';
    box.className='settings-modal';
    box.onclick=function(e){if(e.target===box)box.classList.remove('show');};
    const aiModelOpts = AI_MODELS.map(mm=>'<option value="'+mm.key+'">'+mm.name+'</option>').join('');
    const platFields = PLATFORMS.map(pl=>'<div class="field"><label style="color:'+pl.color+'">'+pl.name+' 发布后台URL</label><input type="url" id="set_plat_'+pl.key+'" placeholder="'+(pl.pubUrlHint||pl.defaultPubUrl||'')+'"></div>').join('');
    box.innerHTML = '<div class="settings-box">'
      +'<h2>⚙️ 看板设置</h2>'
      +'<div style="font-size:12px;color:var(--c-muted)">配置保存在浏览器本地localStorage</div>'
      +'<div class="sec"><h3>🧠 AI文生图配置</h3>'
      +'<div class="field"><label>默认模型</label><select id="set_aiModel">'+aiModelOpts+'</select>'
      +'<div class="hint">Flux免费但受国内网络影响；即梦模式只复制提示词；自定义API需填Key</div></div>'
      +'<div class="field"><label>自定义API Endpoint（OpenAI兼容DALL-E接口）</label><input type="text" id="set_aiEndpoint" placeholder="https://api.openai.com/v1/images/generations"><div class="hint">支持OpenAI、扣子、通义万相等OpenAI兼容图像生成接口</div></div>'
      +'<div class="field"><label>API Key</label><input type="password" id="set_aiApiKey" placeholder="sk-xxxx"><div class="hint">仅存本机浏览器</div></div>'
      +'<div class="field"><label>模型ID（自定义API生效）</label><input type="text" id="set_aiModelId" placeholder="dall-e-3"></div>'
      +'</div>'
      +'<div class="sec"><h3>🔗 平台创作者后台绑定</h3><div style="font-size:12px;color:var(--c-muted);margin-bottom:8px">填入后发布卡片"一键发布"会直达后台</div>'+platFields+'</div>'
      +'<div class="sec"><h3>👤 当前账号</h3><div class="hint">昵称和权限由「账号&协作」中的团队账号管理；这里不再单独设置。</div></div>'
      +'<div class="sfoot"><button class="btn btn-ghost" onclick="document.getElementById(\'settingsModal\').classList.remove(\'show\')">取消</button>'
      +'<button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button></div>'
      +'</div>';
    document.body.appendChild(box);
  }
  // 填充当前值
  const ai = state.config.ai||{};
  const set1=id=>{const el=document.getElementById(id);if(el)el.value='';};
  const fill=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v||'';};
  fill('set_aiModel', ai.model||'flux');
  fill('set_aiEndpoint', ai.endpoint||'');
  fill('set_aiApiKey', ai.apiKey||'');
  fill('set_aiModelId', ai.modelId||'dall-e-3');
  PLATFORMS.forEach(pl=>fill('set_plat_'+pl.key, (state.config.platAccounts&&state.config.platAccounts[pl.key])||''));
  document.getElementById('settingsModal').classList.add('show');
}
function saveSettings(){
  if(!state.config.ai) state.config.ai={};
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  state.config.ai.model = v('set_aiModel')||'flux';
  state.config.ai.endpoint = v('set_aiEndpoint');
  state.config.ai.apiKey = v('set_aiApiKey');
  state.config.ai.modelId = v('set_aiModelId')||'dall-e-3';
  if(!state.config.platAccounts) state.config.platAccounts={};
  PLATFORMS.forEach(pl=>{state.config.platAccounts[pl.key]=v('set_plat_'+pl.key);});
  if(!state.config.collab) state.config.collab={enabled:true,provider:'cloudflare-d1',nickname:'',interval:10000};
  lsSave();
  document.getElementById('settingsModal').classList.remove('show');
  toast('设置已保存','ok');
  render();
}
</script>
