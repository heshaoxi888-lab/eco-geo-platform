<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO 团队工作流 · Cloudflare 协作版</title>
<style>
/* ========== 全局变量 ========== */
:root{
  --c-deep:#1B4332; --c-primary:#2D6A4F; --c-mid:#52B788; --c-light:#D8F3DC; --c-bg:#F4F9F4;
  --c-text:#1B2A22; --c-muted:#6B7F72; --c-border:#B7E4C7; --c-white:#fff;
  --c-xhs:#FF2442; --c-dy:#111; --c-zh:#0084FF; --c-wx:#07C160; --c-geo:#9B59B6;
  --c-xiaoqi:#E63946; --c-parrotfly:#457B9D; --c-shelly:#2A9D8F; --c-sanhe:#E9C46A; --c-afan:#9B59B6; --c-sanyan:#95A5A6;
  --c-danger:#E63946; --c-warn:#F4A261; --c-ok:#2D6A4F;
  --shadow:0 2px 8px rgba(27,67,50,.08); --shadow-lg:0 6px 20px rgba(27,67,50,.15);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--c-primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--c-light);border-radius:4px}
::-webkit-scrollbar-thumb{background:var(--c-mid);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--c-primary)}

/* ========== 顶栏 ========== */
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--c-deep),var(--c-primary));color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap}
.logo{font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .leaf{font-size:20px}
.week-switch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;font-size:13px}
.week-switch button{color:#fff;background:rgba(255,255,255,.15);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.week-switch button:hover{background:rgba(255,255,255,.3)}
.sync-status{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap}
.sync-status .dot{width:8px;height:8px;border-radius:50%;background:#52B788}
.sync-status.syncing .dot{background:#F4A261;animation:pulse 1s infinite}
.sync-status.offline .dot{background:#E63946}
.sync-status.conflict .dot{background:#F59E0B}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-status.syncing .icon{animation:spin 1s linear infinite}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-btn{color:#d0ebdb;padding:8px 12px;border-radius:8px;font-size:13px;white-space:nowrap;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-btn.active{background:#fff;color:var(--c-primary);font-weight:600}
.top-actions{display:flex;gap:6px;align-items:center}
.top-actions button{color:#fff;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap}
.top-actions button:hover{background:rgba(255,255,255,.25)}
.cloud-user{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:18px;font-size:12px;white-space:nowrap}
.cloud-user .avatar{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--c-primary);font-weight:700}

/* ========== 横幅 ========== */
.demo-banner{background:linear-gradient(90deg,#FEF3C7,#FDE68A);color:#78350F;padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px;border-bottom:1px solid #F59E0B}
.demo-banner .btn-clear{margin-left:auto;background:#F59E0B;color:#fff;padding:6px 14px;border-radius:6px;font-weight:600}
.demo-banner .btn-clear:hover{background:#D97706}
.collab-banner{background:linear-gradient(90deg,#DBEAFE,#BFDBFE);color:#1E40AF;padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px;border-bottom:1px solid #3B82F6}
.collab-banner .btn-setup{margin-left:auto;background:#3B82F6;color:#fff;padding:6px 14px;border-radius:6px;font-weight:600}
.collab-banner .btn-setup:hover{background:#2563EB}
.collab-banner.ok{background:linear-gradient(90deg,#DCFCE7,#BBF7D0);color:#166534;border-bottom-color:#22C55E}
.collab-banner.warn{background:linear-gradient(90deg,#FEF3C7,#FDE68A);color:#92400E;border-bottom-color:#F59E0B}
.collab-banner.err{background:linear-gradient(90deg,#FEE2E2,#FECACA);color:#991B1B;border-bottom-color:#EF4444}
.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:12px}
.member-card{background:#fff;border:1px solid var(--c-border);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.member-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.member-name{font-weight:700;color:var(--c-deep)}
.member-email{font-size:12px;color:var(--c-muted);word-break:break-all}
.role-badge{padding:2px 8px;border-radius:999px;background:var(--c-light);color:var(--c-primary);font-size:11px;font-weight:700}
.member-card.disabled{opacity:.58}
.cloud-note{margin-top:10px;padding:9px 12px;border-radius:8px;background:#ECFDF5;color:#166534;font-size:12px}

/* ========== Toast ========== */
.toast-wrap{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--c-deep);color:#fff;padding:10px 18px;border-radius:8px;box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s;pointer-events:auto;max-width:360px}
.toast.ok{background:var(--c-ok)}
.toast.err{background:var(--c-danger)}
.toast.warn{background:var(--c-warn);color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ========== 主区域 ========== */
.main{padding:16px 20px;max-width:1800px;margin:0 auto}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ========== 按钮 ========== */
.btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-deep)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-mid{background:var(--c-mid);color:#fff}
.btn-mid:hover{background:var(--c-primary)}
.btn-ghost{background:var(--c-light);color:var(--c-primary)}
.btn-ghost:hover{background:var(--c-border)}
.btn-danger{background:var(--c-danger);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:10px 22px;font-size:14px;font-weight:600}
.btn-block{width:100%;justify-content:center}
input[type=text],input[type=datetime-local],input[type=url],input[type=password],input[type=number],textarea,select{border:1px solid var(--c-border);border-radius:6px;padding:6px 10px;background:#fff;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--c-mid)}
textarea{resize:vertical;min-height:60px;line-height:1.6}

/* ========== 选题库Tab ========== */
.topic-section{background:var(--c-white);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:16px;color:var(--c-deep);font-weight:700}
.section-head .date-tag{background:var(--c-light);color:var(--c-primary);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.section-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.topic-card{background:#fff;border:1px solid var(--c-border);border-radius:8px;padding:12px;transition:all .2s;cursor:pointer;border-left:3px solid var(--c-mid);position:relative}
.topic-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.topic-card.fixed{border-left-color:var(--c-primary)}
.topic-card.ai{border-left-color:var(--c-warn)}
.topic-card.mine{border-left-color:var(--c-mid)}
.topic-card .t-title{font-weight:600;font-size:13px;margin-bottom:6px;line-height:1.4;color:var(--c-deep)}
.topic-card .t-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.ttype{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--c-light);color:var(--c-primary);font-weight:500}
.tsrc{font-size:10px;padding:1px 6px;border-radius:3px;background:#E0E7FF;color:#3730A3;font-weight:500}
.tplat{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:3px;color:#fff;font-weight:500}
.topic-card .t-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-muted);justify-content:space-between;margin-top:8px}
.topic-card .t-brief{display:none;background:var(--c-bg);padding:10px;border-radius:6px;margin-top:8px;font-size:12px;color:var(--c-muted);line-height:1.6}
.topic-card.expanded .t-brief{display:block}
.topic-card .t-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.topic-card .t-actions .btn{padding:3px 8px;font-size:11px}

/* 选题列表视图（我的选题库） */
.topic-table{width:100%;border-collapse:collapse;font-size:13px}
.topic-table th{text-align:left;padding:10px 8px;background:var(--c-light);color:var(--c-deep);font-weight:600;font-size:12px;border-bottom:2px solid var(--c-border)}
.topic-table td{padding:8px;border-bottom:1px solid var(--c-light);vertical-align:middle}
.topic-table tr:hover{background:var(--c-bg)}
.topic-table .inrow-add{display:flex;gap:6px;padding:10px;background:#F0FDF4}
.topic-table .inrow-add input,.topic-table .inrow-add select{flex:1;min-width:100px}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-bar input[type=text]{flex:1;min-width:180px}
.filter-bar select{min-width:100px}

/* 立项面板 */
.launch-panel{background:#fff;border:2px solid var(--c-mid);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-lg);max-width:800px;margin:20px auto;position:relative;animation:slideDown .3s}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.launch-panel h3{font-size:16px;color:var(--c-deep);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.launch-panel .close{position:absolute;top:12px;right:12px;font-size:20px;color:var(--c-muted);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.launch-panel .close:hover{background:var(--c-light)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--c-deep);margin-bottom:4px}
.form-row .hint{font-size:11px;color:var(--c-muted);margin-top:2px}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.plat-opt{border:2px solid var(--c-border);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:8px}
.plat-opt:hover{border-color:var(--c-mid)}
.plat-opt.selected{border-color:var(--c-primary);background:var(--c-light)}
.plat-opt input[type=checkbox]{margin-top:3px}
.plat-opt .pdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.plat-opt .pinfo{flex:1}
.plat-opt .pname{font-weight:600;font-size:13px}
.plat-opt .pdesc{font-size:11px;color:var(--c-muted);margin-top:2px;line-height:1.4}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--c-border);border-radius:6px;padding:4px;min-height:32px;align-items:center;background:#fff}
.tag-input-wrap .chip{background:var(--c-light);color:var(--c-primary);padding:2px 8px;border-radius:10px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.tag-input-wrap .chip .x{cursor:pointer;font-weight:700;opacity:.6}
.tag-input-wrap input{border:none;flex:1;min-width:80px;padding:2px 6px;outline:none}
.owner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;font-size:12px}
.owner-grid label{display:flex;align-items:center;gap:6px;font-weight:normal}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--c-light)}

/* ========== 看板 ========== */
.kanban-header{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.kanban-title{font-size:18px;font-weight:700;color:var(--c-deep)}
.kanban-tools{margin-left:auto;display:flex;gap:8px}
.progress-bar-wrap{background:var(--c-white);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.progress-bar-wrap .label{font-size:12px;color:var(--c-muted);margin-bottom:6px;display:flex;justify-content:space-between}
.progress-stacked{display:flex;height:26px;border-radius:6px;overflow:hidden;font-size:11px;color:#fff;font-weight:600}
.progress-seg{display:flex;align-items:center;justify-content:center;min-width:28px;transition:width .3s;cursor:pointer}
.progress-seg:hover{opacity:.85}
.kanban-board{display:grid;grid-template-columns:repeat(9,220px);gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--c-white);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);min-height:300px;display:flex;flex-direction:column;min-width:0}
.kcol-head{display:flex;align-items:center;gap:6px;padding:6px 4px 10px;border-bottom:2px solid var(--c-light);margin-bottom:8px}
.kcol-head .dot{width:10px;height:10px;border-radius:50%}
.kcol-head .name{font-weight:600;font-size:13px;color:var(--c-deep)}
.kcol-head .count{margin-left:auto;background:var(--c-light);color:var(--c-primary);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.kcol-body{flex:1;display:flex;flex-direction:column;gap:8px;min-height:100px}
.kcard{background:#fff;border:1px solid var(--c-border);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;position:relative;border-left:4px solid var(--c-mid)}
.kcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.kcard.demo{border-style:dashed;opacity:.8}
.kcard.generating{border-left-color:var(--c-warn);animation:pulse 1.5s infinite}
.kcard-title{font-weight:600;font-size:14px;margin-bottom:6px;line-height:1.5;color:var(--c-deep);padding-right:30px}
.kcard-title .demo-tag{background:#FEF3C7;color:#92400E;font-size:10px;padding:1px 5px;border-radius:3px;margin-right:4px;font-weight:500}
.kcard-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:600;flex-shrink:0}
.kcard-tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:500;line-height:1.3}
.tag.kw{background:var(--c-light);color:var(--c-primary)}
.kcard-foot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--c-muted);justify-content:space-between}
.kcard-foot .last-by{font-style:italic}
.status-icon{font-size:14px}
.generating .status-icon{animation:spin 1s linear infinite;display:inline-block}

/* 卡片展开区 */
.kcard-expand{background:var(--c-bg);border-radius:8px;padding:14px;margin-top:10px;border-top:2px solid var(--c-light);animation:slideDown .2s}
.kcard-expand .info-bar{background:#fff;border-radius:6px;padding:10px;margin-bottom:10px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kcard-expand .info-bar label{font-weight:600;color:var(--c-deep)}
.kcard-expand .info-bar input,.kcard-expand .info-bar select{font-size:12px;padding:3px 8px}
.plat-tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:2px solid var(--c-border);flex-wrap:wrap}
.plat-tab{padding:6px 12px;font-size:12px;font-weight:500;border-radius:6px 6px 0 0;cursor:pointer;color:var(--c-muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.plat-tab.active{color:var(--c-deep);border-bottom-color:var(--c-primary);background:var(--c-light);font-weight:600}
.plat-pane{display:none;background:#fff;border-radius:6px;padding:12px}
.plat-pane.active{display:block}
.draft-block{margin-bottom:10px}
.draft-block label{display:block;font-size:11px;font-weight:600;color:var(--c-deep);margin-bottom:4px}
.title-options{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.title-opt{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border-radius:4px;border:1px solid var(--c-border);cursor:pointer}
.title-opt:hover{background:var(--c-light)}
.title-opt input{margin-right:4px}
.title-opt.custom-input{padding:0;border:none}
.title-opt.custom-input input[type=text]{width:100%;padding:6px 8px}
.draft-textarea{width:100%;min-height:200px;max-height:400px;padding:12px;border:1px solid var(--c-border);border-radius:8px;font-size:14px;line-height:1.8;font-family:inherit;resize:vertical;overflow-y:auto}
.draft-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.draft-tags .tag{cursor:pointer}
.expand-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 0 8px;border-top:1px solid var(--c-border);flex-wrap:wrap;position:sticky;bottom:0;background:var(--c-bg);z-index:5}.expand-actions .btn{min-height:42px;padding:0 20px;font-size:14px;border-radius:8px;font-weight:600;white-space:nowrap}.btn-ghost{background:#F1F5F2;color:var(--c-text);border:1px solid var(--c-border)}.btn-ghost:hover{background:var(--c-light)!important}.btn-primary{background:var(--c-primary);color:#fff;box-shadow:0 2px 6px rgba(45,106,79,.3)}.btn-primary:not(:disabled):hover{background:var(--c-deep)}.btn-primary:disabled{background:#95D5B2!important;color:#fff;cursor:pointer;opacity:.85}.kcard-expand{max-height:78vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}.info-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:#F0FDF4;border-radius:6px;margin-bottom:10px;font-size:12px}.info-bar label{font-weight:600;color:var(--c-deep);white-space:nowrap}.info-bar input,.info-bar select{padding:4px 8px;border:1px solid var(--c-border);border-radius:4px;font-size:12px;background:#fff}

/* AI生成动画 */
.ai-loading{padding:30px;text-align:center}
.ai-loading .spin-orb{width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--c-mid),var(--c-primary),var(--c-light),var(--c-mid));margin:0 auto 14px;animation:spin 1.2s linear infinite;position:relative}
.ai-loading .spin-orb::after{content:"🤖";position:absolute;inset:8px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.ai-loading .steps{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--c-muted)}
.ai-loading .step.done{color:var(--c-primary);text-decoration:line-through}
.ai-loading .step.active{color:var(--c-deep);font-weight:600}

/* 裂变子任务 */
.split-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.split-item{background:var(--c-bg);padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:12px}
.split-item input[type=checkbox]{margin-right:4px}
.split-item input[type=text]{flex:1;font-size:12px;padding:3px 6px}
.split-item .stype{background:var(--c-light);color:var(--c-primary);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.split-item select{font-size:11px;padding:2px 4px}
.split-item .del{color:var(--c-danger);font-size:14px;padding:2px 6px}

/* 合规清单 */
.checklist{display:flex;flex-direction:column;gap:6px;margin:8px 0}

/* v3.2 裂变内容预览 */
.split-content-preview{background:#fff;border:1px solid var(--c-border);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;line-height:1.6;max-height:140px;overflow-y:auto;white-space:pre-wrap;display:none}
.split-content-preview.show{display:block}
.split-content-preview .ai-badge{display:inline-block;background:#F4A261;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;margin-right:4px}
.split-gen-btn{background:#F4A261;color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap}
.split-gen-btn:hover{background:#E76F51}
.split-gen-btn.done{background:var(--c-primary)}
.split-account{font-size:11px;color:var(--c-muted);margin-left:4px}
/* v3.2 合规AI检测 */
.compliance-report{background:#fff;border:1px solid var(--c-border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px}
.compliance-report .hit{background:#FEE2E2;color:#B91C1C;padding:1px 4px;border-radius:3px;font-weight:600}
.compliance-report .warn{background:#FEF3C7;color:#92400E;padding:1px 4px;border-radius:3px;font-weight:600}
.compliance-report .ok{color:var(--c-primary);font-weight:600}
.compliance-report .rule-line{display:flex;align-items:center;gap:6px;margin:3px 0}
.compliance-report .rule-line input{flex:1;font-size:11px;padding:2px 5px;border:1px solid var(--c-border);border-radius:3px}
.compliance-report .rule-line .del-rule{color:var(--c-danger);cursor:pointer;padding:2px 6px;font-size:14px}
.compliance-report textarea{width:100%;font-size:11px;padding:4px 6px;border:1px solid var(--c-border);border-radius:4px;min-height:60px;resize:vertical;margin-top:4px}
.compliance-report .ai-scan-btn{background:#2A9D8F;color:#fff;border:none;padding:4px 12px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600;margin-right:6px}
.compliance-report .ai-scan-btn:hover{background:#1B7A69}
.compliance-report .add-rule-btn{background:#E8F5E9;color:var(--c-primary);border:1px dashed var(--c-mid);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;margin-top:4px}
.compliance-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--c-border);font-size:12px}
.compliance-item:last-child{border-bottom:none}
.compliance-item .status-icon{font-size:16px}
.compliance-item .detail{flex:1;font-size:11px;color:var(--c-muted);margin-top:2px}
.checklist label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}

/* 物料清单 */
.mat-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mat-item{display:flex;align-items:center;gap:10px;background:var(--c-bg);padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;border:2px solid transparent;margin-bottom:6px;}
.mat-item:hover{background:#E8F5E9;}
.mat-item.mat-active{border-color:#52B788;background:#D8F3DC;box-shadow:0 0 0 2px rgba(82,183,136,0.2);}
.mat-item.mat-active::after{content:'当前';font-size:9px;color:#2D6A4F;font-weight:600;margin-left:2px;white-space:nowrap;}
.mat-item input[type=text]{flex:1;font-size:12px;padding:3px 6px}
.mat-item select{font-size:11px;padding:2px 4px}
.mat-target-hint{font-size:11px;color:#2D6A4F;font-weight:600;margin-bottom:6px;padding:5px 10px;background:#D8F3DC;border-radius:4px;}

/* 发布排期 */
.sched-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.sched-item{display:flex;align-items:center;gap:10px;background:var(--c-bg);padding:8px 12px;border-radius:6px;font-size:12px;flex-wrap:wrap}
.sched-item .plat-label{width:70px;font-weight:600}
.sched-item input[type=datetime-local]{flex:1;min-width:180px}

/* 数据录入 */
.data-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}
.data-grid .dg-cell{display:flex;flex-direction:column;gap:2px}
.data-grid label{font-size:11px;color:var(--c-muted);font-weight:500}
.data-grid input{padding:4px 8px;font-size:12px}
.countdown-ring{width:70px;height:70px;margin:10px auto;position:relative}
.countdown-ring svg{transform:rotate(-90deg)}
.countdown-ring .cd-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--c-muted)}
.countdown-ring .cd-text strong{font-size:18px;color:var(--c-deep)}

/* ========== 发布排期Tab（周视图） ========== */
.cal-wrap{background:var(--c-white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:60px repeat(7,1fr);gap:1px;background:var(--c-border);border-radius:8px;overflow:hidden;min-width:900px}
.cal-cell{background:#fff;padding:6px;min-height:60px;font-size:11px;position:relative}
.cal-cell.head{background:var(--c-light);font-weight:600;text-align:center;color:var(--c-deep);min-height:auto;padding:8px}
.cal-cell.time-head{background:var(--c-deep);color:#fff;font-weight:600;text-align:center;min-height:auto}
.cal-cell .ev{padding:3px 6px;border-radius:4px;color:#fff;font-size:10px;margin-bottom:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-cell.today{background:#FFFBEB}

/* ========== 分工Tab ========== */
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.person-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-top:4px solid var(--c-mid)}
.person-card.xiaoqi{border-top-color:var(--c-xiaoqi)}
.person-card.parrotfly{border-top-color:var(--c-parrotfly)}
.person-card.shelly{border-top-color:var(--c-shelly)}
.person-card.sanhe{border-top-color:var(--c-sanhe)}
.person-card.afan{border-top-color:var(--c-afan)}
.person-card.sanyan{border-top-color:var(--c-sanyan)}
.person-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.person-head .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.person-head .pinfo h3{font-size:15px;color:var(--c-deep)}
.person-head .pinfo .role{font-size:11px;color:var(--c-muted)}
.person-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;text-align:center}
.person-stats .stat{background:var(--c-bg);padding:6px;border-radius:6px}
.person-stats .stat .num{font-size:18px;font-weight:700;color:var(--c-deep)}
.person-stats .stat .lbl{font-size:10px;color:var(--c-muted)}
.goal-bar{height:8px;background:var(--c-light);border-radius:4px;overflow:hidden;margin-bottom:10px}
.goal-bar .fill{height:100%;background:linear-gradient(90deg,var(--c-mid),var(--c-primary));transition:width .4s}
.goal-label{font-size:11px;color:var(--c-muted);display:flex;justify-content:space-between;margin-bottom:4px}
.person-tasks{max-height:200px;overflow-y:auto}
.person-tasks .pt{font-size:12px;padding:4px 6px;border-radius:4px;display:flex;align-items:center;gap:6px;margin-bottom:3px;cursor:pointer}
.person-tasks .pt:hover{background:var(--c-light)}
.person-tasks .pt .st-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ========== KPI Tab ========== */
.kpi-top{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.kpi-card .num{font-size:24px;font-weight:700;color:var(--c-deep)}
.kpi-card .lbl{font-size:11px;color:var(--c-muted);margin-top:2px}
.budget-card{background:linear-gradient(135deg,var(--c-primary),var(--c-deep));color:#fff}
.budget-card .num{color:#fff}
.budget-card .lbl{color:#D8F3DC}
.signal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.signal-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--c-border)}
.signal-card.hit{border-left-color:var(--c-warn);background:linear-gradient(90deg,#FFFBEB,#fff)}
.signal-card .stitle{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--c-deep)}
.signal-card .sdesc{font-size:11px;color:var(--c-muted);margin-bottom:8px}
.signal-card .sprog{height:6px;background:var(--c-light);border-radius:3px;overflow:hidden}
.signal-card .sprog .fill{height:100%;background:var(--c-mid)}
.signal-card.hit .sprog .fill{background:var(--c-warn)}
.signal-card .smeta{display:flex;justify-content:space-between;font-size:11px;color:var(--c-muted);margin-top:4px}
.budget-wrap{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.budget-bar{height:20px;background:var(--c-light);border-radius:10px;overflow:hidden;margin:8px 0;position:relative}
.budget-bar .fill{height:100%;background:linear-gradient(90deg,var(--c-mid),var(--c-primary));transition:width .4s}
.budget-bar .fill.warn{background:linear-gradient(90deg,var(--c-warn),#E76F51)}
.budget-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--c-muted)}
.boost-banner{background:linear-gradient(135deg,#F4A261,#E76F51);color:#fff;padding:14px 20px;border-radius:var(--radius);margin-bottom:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;animation:pulse 2s infinite}
table.data-tbl{width:100%;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border-collapse:collapse}
table.data-tbl th{background:var(--c-deep);color:#fff;padding:10px 8px;font-size:12px;text-align:left}
table.data-tbl td{padding:8px;border-bottom:1px solid var(--c-light);font-size:12px}
table.data-tbl tr:hover{background:var(--c-bg)}
table.data-tbl input{width:100%;padding:4px 6px;font-size:12px}

/* ========== 素人BD Tab ========== */
.bd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.bd-stats .kpi-card .num{font-size:22px}
table.bd-tbl{width:100%;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border-collapse:collapse;font-size:12px}
table.bd-tbl th{background:var(--c-primary);color:#fff;padding:8px 6px;font-size:11px;text-align:left;white-space:nowrap}
table.bd-tbl td{padding:6px;border-bottom:1px solid var(--c-light)}
table.bd-tbl input,table.bd-tbl select{width:100%;padding:3px 6px;font-size:11px}
table.bd-tbl tr:hover{background:var(--c-bg)}

/* ========== GEO Tab ========== */
.geo-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.geo-matrix-wrap{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);overflow-x:auto;margin-bottom:14px}
.geo-matrix{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
.geo-matrix th{background:var(--c-deep);color:#fff;padding:8px 6px;font-size:11px;text-align:center;position:sticky;top:0}
.geo-matrix th:first-child{text-align:left;position:sticky;left:0;z-index:2}
.geo-matrix td{padding:6px;border:1px solid var(--c-light);text-align:center;cursor:pointer;min-width:60px}
.geo-matrix td:first-child{text-align:left;font-weight:500;position:sticky;left:0;background:#fff;z-index:1}
.geo-matrix td.q-cell{background:#fff}
.geo-matrix td.q-cell:hover{background:var(--c-light)}
.geo-matrix .lv0{background:#FEE2E2;color:#991B1B}
.geo-matrix .lv1{background:#FEF3C7;color:#92400E}
.geo-matrix .lv2{background:#DBEAFE;color:#1E40AF}
.geo-matrix .lv3{background:#D1FAE5;color:#065F46;font-weight:600}
.geo-chart-wrap{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.geo-chart{height:140px;display:flex;align-items:flex-end;gap:6px;padding:10px 0;border-bottom:1px solid var(--c-border);position:relative}
.geo-chart .bar{flex:1;background:linear-gradient(180deg,var(--c-mid),var(--c-primary));border-radius:4px 4px 0 0;position:relative;transition:height .4s;min-height:4px}
.geo-chart .bar:hover{opacity:.8}
.geo-chart .bar .bl{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--c-muted);white-space:nowrap}
.geo-chart-lbl{display:flex;gap:6px;font-size:10px;color:var(--c-muted);padding-top:6px}
.geo-chart-lbl span{flex:1;text-align:center}

/* ========== 账号Tab ========== */
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.acct-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-top:4px solid var(--c-mid)}
.acct-card.xhs{border-top-color:var(--c-xhs)}
.acct-card.dy{border-top-color:var(--c-dy)}
.acct-card.zh{border-top-color:var(--c-zh)}
.acct-card.wx{border-top-color:var(--c-wx)}
.acct-card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.acct-card .field{margin-bottom:8px}
.acct-card label{font-size:11px;color:var(--c-muted);display:block;margin-bottom:2px}
.acct-card input{width:100%;padding:5px 8px;font-size:12px}
.collab-section{background:linear-gradient(135deg,#E0F2FE,#DBEAFE);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;border:1px solid #93C5FD}
.collab-section h3{color:#1E40AF;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.collab-desc{font-size:12px;color:#1E3A8A;margin-bottom:12px;line-height:1.6}
.collab-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.collab-form .field{display:flex;flex-direction:column;gap:4px}
.collab-form label{font-size:11px;font-weight:600;color:#1E40AF}
.collab-form input{padding:6px 10px}
.collab-status-line{padding:8px 12px;border-radius:6px;font-size:12px;margin-top:10px;font-weight:500}
.collab-status-line.ok{background:#D1FAE5;color:#065F46}
.collab-status-line.off{background:#FEE2E2;color:#991B1B}

/* ========== 帮助抽屉 ========== */
.help-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
.help-mask.show{display:flex;align-items:flex-start;justify-content:flex-end}
.help-drawer{width:500px;max-width:100%;height:100%;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.2);padding:24px;overflow-y:auto;animation:slideRight .3s}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.help-drawer h2{color:var(--c-deep);margin-bottom:12px;font-size:18px}
.help-drawer h3{color:var(--c-primary);margin:16px 0 8px;font-size:14px}
.help-drawer p,.help-drawer li{font-size:13px;line-height:1.7;margin-bottom:6px;color:var(--c-text)}
.help-drawer ul,.help-drawer ol{padding-left:20px}
.help-drawer .close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;font-size:20px;background:var(--c-light);border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ========== 新手引导 ========== */
.guide-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center}
.guide-mask.show{display:flex}
.guide-box{background:#fff;border-radius:var(--radius);padding:28px;max-width:460px;box-shadow:var(--shadow-lg);text-align:center}
.guide-box h2{color:var(--c-deep);margin-bottom:10px;font-size:20px}
.guide-box p{color:var(--c-muted);margin-bottom:14px;line-height:1.7}
.guide-steps{text-align:left;margin:14px 0}
.guide-steps .gs{padding:10px;background:var(--c-bg);border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.guide-steps .gs .n{width:24px;height:24px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:12px}

/* ========== 操作日志 ========== */
.log-panel{max-height:400px;overflow-y:auto;background:var(--c-bg);border-radius:6px;padding:10px;margin-top:10px}
.log-item{font-size:12px;padding:6px 0;border-bottom:1px dashed var(--c-border);display:flex;gap:8px}
.log-item .tm{color:var(--c-muted);white-space:nowrap;font-family:monospace}
.log-item .who{font-weight:600;color:var(--c-primary)}

/* ========== 底部 ========== */
.footer{text-align:center;padding:20px;color:var(--c-muted);font-size:11px;margin-top:20px;border-top:1px solid var(--c-border)}
.footer .v{color:var(--c-primary);font-weight:600}

/* ========== 响应式 ========== */
@media(max-width:1200px){
  .kanban-board{grid-template-columns:repeat(9,200px);gap:8px}
}
@media(max-width:768px){.kanban-board{grid-template-columns:repeat(9,180px)!important;gap:6px}.task-drawer{width:100vw!important}}
@media(max-width:768px){
  .topbar{padding:8px 12px;gap:8px}
  .nav{order:10;width:100%;overflow-x:auto}
  .main{padding:10px}
}

/* v3.3 手动改写模态 */
.mf-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.mf-mask.show{display:flex}
.mf-box{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mf-head{padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px;font-weight:600}
.mf-head .mf-word{background:#FDE8E8;color:#E63946;padding:2px 8px;border-radius:4px;font-size:13px}
.mf-body{padding:16px 20px;overflow-y:auto;flex:1}
.mf-tip{font-size:12px;color:#666;margin-bottom:8px}
.mf-textarea{width:100%;min-height:200px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;line-height:1.7;resize:vertical;font-family:inherit}
.mf-textarea mark{background:#FDE8E8;color:#E63946;padding:0 2px;border-radius:2px}
.mf-quick{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mf-foot{padding:12px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}


/* v3.4 AI配图系统 */
.img-section{margin-top:12px;padding:12px;background:#F8FAF6;border-radius:8px;border:1px dashed #B7D8B0;}
.img-section-title{font-weight:600;color:var(--c-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.img-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.img-tab{padding:6px 12px;border:1px solid #D0E0CC;border-radius:16px;background:#fff;cursor:pointer;font-size:12px;color:var(--c-muted);transition:all .2s;user-select:none;}
.img-tab.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.img-tab:hover{border-color:var(--c-primary);}
.img-panel{display:none;}
.img-panel.active{display:block;}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
.rec-item{border:2px solid #E0E8DC;border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:center;transition:all .2s;position:relative;}
.rec-item:hover{border-color:var(--c-primary);transform:translateY(-1px);box-shadow:0 2px 8px rgba(45,106,79,0.15);}
.rec-item.selected{border-color:var(--c-primary);background:var(--c-light);}
.rec-item img{width:80px;height:80px;object-fit:contain;display:block;margin:0 auto;}
.rec-item .rn{font-size:11px;color:var(--c-deep);margin-top:4px;line-height:1.2;}
.rec-item .rbadge{position:absolute;top:2px;right:2px;background:var(--c-primary);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;}
.ai-gen-box{background:#fff;border-radius:8px;padding:10px;border:1px solid #E0E8DC;}
.prompt-box{background:#F0F7EE;border-radius:6px;padding:8px;margin-bottom:8px;font-size:12px;line-height:1.5;color:var(--c-deep);}
.prompt-box textarea{width:100%;min-height:70px;border:1px solid #D0E0CC;border-radius:4px;padding:6px;font-size:12px;font-family:inherit;resize:vertical;background:#fff;margin-top:6px;box-sizing:border-box;}
.ai-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.ai-ctrl select{padding:4px 8px;border:1px solid #D0D8D4;border-radius:4px;font-size:12px;}
.ai-result{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.ai-gen-card{width:150px;border:1px solid #E0E0E0;border-radius:6px;overflow:hidden;background:#fafafa;position:relative;}
.ai-gen-card img{width:100%;height:160px;object-fit:cover;display:block;background:#f0f0f0;}
.ai-gen-card .ai-acts{display:flex;gap:2px;padding:4px;background:#fff;}
.ai-gen-card .ai-acts button{flex:1;font-size:10px;padding:4px 0;border:1px solid #ddd;background:#f8f8f8;border-radius:3px;cursor:pointer;}
.ai-gen-card .ai-acts button:hover{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.ai-gen-card .ai-loading{position:absolute;inset:0;background:rgba(255,255,255,0.88);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;color:var(--c-primary);}
.ai-gen-card .spinner{width:24px;height:24px;border:3px solid #D8F3DC;border-top-color:var(--c-primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.upload-area{border:2px dashed #B7D8B0;border-radius:8px;padding:24px;text-align:center;background:#fff;cursor:pointer;transition:all .2s;}
.upload-area:hover{border-color:var(--c-primary);background:var(--c-light);}
.upload-area .up-ico{font-size:32px;margin-bottom:6px;}
.upload-area .up-hint{font-size:12px;color:var(--c-muted);}
.picked-preview{margin-top:10px;padding:10px;background:#fff;border-radius:8px;border:1px solid #D8F3DC;display:none;}
.picked-preview.show{display:block;}
.picked-preview img{max-width:100px;max-height:100px;border-radius:6px;display:block;margin:0 auto 4px;border:1px solid #eee;}
.picked-preview .pp-info{font-size:11px;color:var(--c-muted);text-align:center;margin-bottom:4px;}
.mat-img-thumb{width:36px;height:36px;border-radius:4px;object-fit:cover;border:1px solid #eee;cursor:pointer;flex-shrink:0;}
.mat-img-placeholder{width:36px;height:36px;border-radius:4px;background:#F0F7EE;border:1px dashed #B7D8B0;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;color:var(--c-muted);}


/* v3.6 新增 */
.ai-model-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--c-border)}
.ai-model-row label{font-size:11px;color:var(--c-muted);white-space:nowrap}
.ai-model-row select{font-size:12px;padding:4px 8px;border:1px solid var(--c-border);border-radius:4px}
.copy-prompt-btn{background:#FEF3C7;color:#92400E;border:1px solid #F59E0B;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.copy-prompt-btn:hover{background:#FDE68A}
.plat-bind-section{background:#F0F9FF;border:1px dashed #60A5FA;border-radius:8px;padding:10px;margin-top:8px;font-size:12px}
.plat-bind-section h4{margin:0 0 6px;color:#1E40AF;font-size:12px}
.plat-bind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.plat-bind-grid .pb-item{display:flex;align-items:center;gap:4px}
.plat-bind-grid .pb-item label{min-width:50px;font-size:11px;color:#1E40AF}
.plat-bind-grid .pb-item input{flex:1;padding:4px 6px;border:1px solid #93C5FD;border-radius:4px;font-size:11px;background:#fff}
.settings-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.settings-modal.show{display:flex}
.settings-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.settings-box h2{margin:0 0 6px;color:var(--c-deep);font-size:18px}
.settings-box .sec{margin:14px 0;padding:12px;background:#F8FAF9;border-radius:8px;border:1px solid var(--c-border)}
.settings-box .sec h3{margin:0 0 8px;font-size:14px;color:var(--c-deep);display:flex;align-items:center;gap:6px}
.settings-box .field{margin:8px 0;display:flex;flex-direction:column;gap:4px}
.settings-box .field label{font-size:12px;font-weight:600;color:var(--c-text)}
.settings-box .field input,.settings-box .field select,.settings-box .field textarea{padding:7px 10px;border:1px solid var(--c-border);border-radius:6px;font-size:13px;font-family:inherit}
.settings-box .field .hint{font-size:11px;color:var(--c-muted);line-height:1.5}
.settings-box .sfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pub-url-done{color:#059669;font-weight:600;font-size:12px}


/* === 卡片详情抽屉 (v3.9) === */
.kcard.active-card{border:2px solid var(--c-primary)!important;box-shadow:0 0 0 3px rgba(82,183,136,.25)!important;transform:translateY(-2px)!important}
.drawer-overlay{position:fixed;inset:0;background:rgba(27,67,50,.35);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.task-drawer{position:fixed;top:0;right:0;width:min(760px,92vw);height:100vh;background:#F8FAF9;z-index:901;box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.task-drawer.show{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:#fff;border-bottom:2px solid var(--c-light);flex-shrink:0}
.drawer-header .d-status{font-size:20px}
.drawer-header .d-title{flex:1;font-size:16px;font-weight:700;color:var(--c-deep);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-header .d-close{width:36px;height:36px;border-radius:50%;border:none;background:var(--c-light);color:var(--c-deep);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0}
.drawer-header .d-close:hover{background:var(--c-border)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px;scrollbar-width:thin}
.drawer-body .kcard-expand{background:#fff;border-radius:10px;padding:18px;box-shadow:var(--shadow);max-height:none;overflow:visible;margin-top:0;border-top:none}
.drawer-body .kcard-expand .info-bar{background:#F0FDF4;padding:10px 12px;flex-wrap:wrap}
.drawer-body .draft-textarea{min-height:280px;font-size:14px;line-height:1.8;padding:14px}
.drawer-body .expand-actions{position:sticky;bottom:0;background:#fff;margin:14px -18px -18px;padding:14px 18px;border-top:2px solid var(--c-light);box-shadow:0 -4px 12px rgba(0,0,0,.04);z-index:5}
/* compact kcard for narrower cols */
.kcard-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard-tags{max-height:40px;overflow:hidden}
</style>

function aiConfigured(){
  const a = state.config.ai||{};
  return !!(AI_PROVIDERS[a.provider]&&AI_PROVIDERS[a.provider].configured&&AI_PROVIDERS[a.provider].configured(a));
}

async function callAI(systemPrompt, userPrompt){
  const a = state.config.ai||{};
  const provider = AI_PROVIDERS[a.provider]||AI_PROVIDERS.coze;
  if(!provider.configured(a)){
    throw new Error(a.provider==='coze'
      ? '扣子服务尚未由 Cloudflare 配置完成，请联系管理员'
      : 'AI未配置，请去「账号&协作」填写豆包/DeepSeek Key');
  }
  const req = provider.buildReq(a, [
    {role:'system', content: systemPrompt},
    {role:'user', content: userPrompt}
  ]);
  let resp;
  try{
    resp = await fetch(req.url, req.opts);
  }catch(err){
    if(isSandboxed&&isSandboxed()){
      throw new Error('在预览iframe中无法联网请求AI。请点右上角📥下载HTML到本地双击打开，或访问部署后的在线网页。');
    }
    throw new Error('网络错误：'+(err.message||err));
  }
  if(!resp.ok){
    let errMsg = 'HTTP '+resp.status;
    try{ const e=await resp.json(); errMsg = e.msg||(typeof e.error==='string'?e.error:e.error?.message)||e.message||errMsg; }catch(_){}
    if(resp.status===401&&a.provider==='coze') errMsg = '团队登录已失效，请刷新页面后重新登录';
    else if(resp.status===401) errMsg = '鉴权失败，请检查 API Key 是否正确（401）';
    throw new Error(errMsg);
  }
  const data = await resp.json();
  const text = provider.parseResp(data);
  if(!text) throw new Error('AI返回内容为空');
  return text.trim();
}

function parseDraftResponse(raw, plat){
  if(!raw) return null;
  let text = raw.trim().replace(/^\uFEFF/,'');
  text = text.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const s = text.indexOf('{');
  const e = text.lastIndexOf('}');
  if(s<0||e<=s){
    // 不是JSON，全文当body兜底
    return {titles:['（AI生成·请补标题）'],selectedTitle:0,customTitle:'',body:text,tags:[],cta:'',_ai:true,_platform:plat,_time:Date.now(),_parseFallback:true};
  }
  try{
    const obj = JSON.parse(text.slice(s,e+1));
    return {
      titles: Array.isArray(obj.titles)&&obj.titles.length?obj.titles:[obj.title||'标题'],
      selectedTitle:0, customTitle:'',
      body: String(obj.body||'').replace(/\\n/g,'\n'),
      tags: Array.isArray(obj.tags)?obj.tags:[],
      cta: obj.cta||'',
      _ai:true, _platform:plat, _time:Date.now()
    };
  }catch(e){
    return {titles:['（AI生成·请补标题）'],selectedTitle:0,customTitle:'',body:text,tags:[],cta:'',_ai:true,_platform:plat,_time:Date.now(),_parseFallback:true};
  }
}

function pickEmoji(){ return randPick(['✨','🌿','💚','🧴','🌸','💡','✅','❗','🙋‍♀️','👶','🤰','💪','🔥','⭐','🎯','💕']); }
function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildCtx(topic, sku){
  const skuInfo = SKU_FULL[sku] || SKU_FULL['全家套装'];
  const now = new Date();
  const month = now.getMonth()+1;
  let season = '夏季';
  if(month>=3&&month<=5) season='春季';
  else if(month>=6&&month<=8) season='夏季';
  else if(month>=9&&month<=11) season='秋季';
  else season='冬季';
  const momtopic = randPick(['宝宝洗护','孕期护理','新生儿护理','产后护理','儿童防晒']);
  const scenes = ['夏日出游','出差旅行','运动健身','加班回家','海边度假','带娃出行','孕期日常','周末约会','办公室通勤'];
  const methods = ['正确洗头','面霜乳化','涂抹防晒','宝宝洗澡','头皮按摩','护发步骤'];
  return {
    sku: skuInfo.name,
    skuKey: sku,
    ing: topic.keywords && topic.keywords[0] ? topic.keywords[0] : skuInfo.ing,
    aud: skuInfo.aud,
    pain: skuInfo.pain,
    sell: randPick(SELL_POINTS),
    cert: randPick(CERTS),
    tags: topic.keywords || [],
    type: topic.type,
    title: topic.title,
    season: season,
    scene: randPick(scenes),
    method: randPick(methods),
    momtopic: momtopic,
    brand: 'ECO'
  };
}

function genTags(ctx, type, plat){
  const base = ['#ECO有机','#德国有机','#有机洗护'];
  const extra = [];
  if(ctx.ing) extra.push('#'+ctx.ing);
  if(ctx.pain) extra.push('#'+ctx.pain);
  if(ctx.aud) extra.push('#'+ctx.aud.replace(/人群/g,''));
  if(plat==='xhs') extra.push('#小红书好物','#种草','#好物分享','#真实测评');
  if(ctx.skuKey) extra.push('#'+ctx.sku.replace('ECO',''));
  ctx.tags.forEach(t=>extra.push('#'+t));
  const all = [...new Set([...base,...extra])].slice(0,12);
  return all.join(' ');
}

function getWeekOffset(offset){
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1 + offset*7);
  monday.setHours(0,0,0,0);
  return monday.getTime();
}
function weekLabel(ts){
  const d = new Date(ts);
  const end = new Date(ts); end.setDate(d.getDate()+6);
  return `${d.getMonth()+1}/${d.getDate()} - ${end.getMonth()+1}/${end.getDate()}`;
}
function weekDates(ts){
  const d = new Date(ts);
  const dates=[];
  for(let i=0;i<7;i++){const dt=new Date(d);dt.setDate(d.getDate()+i);dates.push(dt);}
  return dates;
}
function fmtTime(ts){
  const d=new Date(ts);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function relTime(ts){
  const diff = Date.now()-ts;
  if(diff<60000) return '刚刚';
  if(diff<3600000) return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000) return Math.floor(diff/3600000)+'小时前';
  return Math.floor(diff/86400000)+'天前';
}

let cloudSession = {ready:false,user:null,members:[],logs:[],version:0,workspace:null,error:'',canEdit:false,hasRemoteState:false};
let collabState = {status:'offline',timer:null,pushTimer:null,lastRemoteVersion:0,localDirty:false};

function escHtml(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function roleLabel(role){ return ({owner:'所有者',admin:'管理员',editor:'编辑者',viewer:'查看者'})[role]||role||'成员'; }

async function cloudRequest(url, options={}){
  const headers = {...(options.headers||{})};
  if(options.body && !headers['Content-Type']) headers['Content-Type']='application/json';
  const response = await fetch(url,{credentials:'same-origin',...options,headers});
  const data = await response.json().catch(()=>({}));
  if(!response.ok){
    const error = new Error(data.error||`请求失败（${response.status}）`);
    error.status=response.status; error.payload=data;
    throw error;
  }
  return data;
}

async function loadAIServiceStatus(){

    serverAI.loaded=true;
    serverAI.configured=!!data.configured;
    serverAI.provider=data.provider||'coze';
    serverAI.managedBy=data.managedBy||'';
    serverAI.error='';
  }catch(error){
    serverAI.loaded=true;
    serverAI.configured=false;
    serverAI.error=error.message||'无法读取 AI 服务状态';
  }

}

async function cloudBootstrap(){
  collabSetStatus('syncing');
  try{
    const data = await cloudRequest('/api/bootstrap');
    cloudSession.ready=true;
    cloudSession.error='';
    cloudSession.user=data.user;
    cloudSession.members=data.members||[];
    cloudSession.workspace=data.workspace||null;
    cloudSession.version=Number(data.workspace?.version||0);
    cloudSession.hasRemoteState=!!data.state;
    cloudSession.canEdit=data.user?.role!=='viewer';
    if(data.state) applyRemoteDashboardState(data.state);
    state.config=state.config||{};
    state.config.collab={...(state.config.collab||{}),enabled:true,provider:'cloudflare-d1',nickname:data.user?.name||data.user?.email||'',interval:10000};
    collabState.lastRemoteVersion=cloudSession.version;
    collabState.localDirty=false;
    lsSave();
    collabSetStatus('synced');
    return true;
  }catch(error){
    cloudSession.error=error.message;
    cloudSession.ready=false;
    collabSetStatus('offline');
    return false;
  }
}

async function collabFetch(){
  if(!cloudSession.ready) return;
  collabSetStatus('syncing');
  try{
    const data=await cloudRequest('/api/state');
    const nextVersion=Number(data.version||0);
    if(data.state && nextVersion>cloudSession.version){
      if(collabState.localDirty) mergeRemote(data.state);
      else applyRemoteDashboardState(data.state);
      cloudSession.version=nextVersion;
      collabState.lastRemoteVersion=nextVersion;
      setupDraftProxies();
      lsSave();
      render();
    }
    collabSetStatus('synced');
  }catch(error){
    console.warn('Cloudflare pull error',error);
    collabSetStatus('offline');
  }
}

function applyRemoteDashboardState(remote){
  const localAI={...(state.config?.ai||{})};
  Object.assign(state,remote);
  state.config=state.config||{};
  state.config.ai={
    ...(state.config.ai||{}),
    doubaoKey:localAI.doubaoKey||'',
    deepseekKey:localAI.deepseekKey||''
  };
  delete state.config.ai.cozePat;
  delete state.config.ai.cozeBotId;
}

function mergeRemote(remote){
  const localTasks=Object.fromEntries((state.tasks||[]).map(t=>[t.id,t]));
  const remoteTasks=Object.fromEntries((remote.tasks||[]).map(t=>[t.id,t]));
  state.tasks=[...new Set([...Object.keys(localTasks),...Object.keys(remoteTasks)])].map(id=>{
    const a=localTasks[id],b=remoteTasks[id];
    if(!a) return b; if(!b) return a;
    return (a.lastTime||0)>(b.lastTime||0)?a:b;
  });
  const localTopics=Object.fromEntries((state.myTopics||[]).map(t=>[t.id,t]));
  const remoteTopics=Object.fromEntries((remote.myTopics||[]).map(t=>[t.id,t]));
  state.myTopics=[...new Set([...Object.keys(localTopics),...Object.keys(remoteTopics)])].map(id=>{
    const a=localTopics[id],b=remoteTopics[id];
    if(!a) return b; if(!b) return a;
    return (a.addTime||0)>(b.addTime||0)?a:b;
  });
  ['bdList','geoData','geoHistory','accounts','budget','signals','persons'].forEach(k=>{
    if(remote[k]!==undefined) state[k]=remote[k];
  });
}

async function collabPush(retrying=false){
  if(!cloudSession.ready || !cloudSession.canEdit) return;
  collabSetStatus('syncing');
  state._syncVersion=(state._syncVersion||0)+1;
  state._lastModified=Date.now();
  state._lastModifiedBy=cloudSession.user?.name||cloudSession.user?.email||'团队成员';
  try{
    const data=await cloudRequest('/api/state',{
      method:'PUT',
      body:JSON.stringify({state,expectedVersion:cloudSession.version,action:'同步工作流看板'})
    });
    cloudSession.version=Number(data.version||cloudSession.version+1);
    collabState.lastRemoteVersion=cloudSession.version;
    collabState.localDirty=false;
    lsSave();
    collabSetStatus('synced');
  }catch(error){
    if(error.status===409 && !retrying && error.payload?.state){
      mergeRemote(error.payload.state);
      cloudSession.version=Number(error.payload.version||cloudSession.version);
      toast('检测到团队成员的新修改，已自动合并','warn');
      return collabPush(true);
    }
    console.warn('Cloudflare push error',error);
    collabState.localDirty=true;
    collabSetStatus(error.status===409?'conflict':'offline');
    toast(error.message||'同步失败，修改已保存在本机','err');
  }
}

function collabSetStatus(status){
  collabState.status=status;
  const el=document.getElementById('syncStatus');
  if(!el) return;
  el.className='sync-status '+status;
  const icon=status==='synced'?'🟢':status==='syncing'?'⏳':status==='conflict'?'⚠️':'🔴';
  const label=status==='synced'?'D1 已同步':status==='syncing'?'同步中…':status==='conflict'?'待合并':'离线缓存';
  el.innerHTML=`<span class="icon">${icon}</span><span>${label}</span>`;
}

function schedulePush(){
  collabState.localDirty=true;
  lsSave();
  if(!cloudSession.ready || !cloudSession.canEdit) return;
  if(collabState.pushTimer) clearTimeout(collabState.pushTimer);
  collabState.pushTimer=setTimeout(()=>collabPush(),1200);
}

function startCollab(){
  if(collabState.timer) clearInterval(collabState.timer);
  if(!cloudSession.ready) return collabSetStatus('offline');
  collabSetStatus('synced');
  collabState.timer=setInterval(collabFetch,state.config.collab.interval||10000);
}

/* ========== Toast ========== */
function toast(msg, type='ok'){
  const wrap = document.getElementById('toastWrap') || (()=>{
    const d=document.createElement('div');d.id='toastWrap';d.className='toast-wrap';document.body.appendChild(d);return d;
  })();
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2500);
}

let aiDailyDate = null;

function getAIDaily(){
  const today = new Date().toDateString();
  if(aiDailyDate !== today || !aiTopicDaily){
    // 根据星期几偏置
    const wd = new Date().getDay();
    let pool = [...AI_TOPIC_POOL];
    // 工作日多加一些干货类，周末加场景/生活类
    if(wd>=1 && wd<=5){
      pool = pool.filter(x=>['成分科普','对比测评','痛点解决','母婴专题','品牌故事'].includes(x.type) || Math.random()>0.3);
    }else{
      pool = pool.filter(x=>['场景种草','用户证言','季节护肤','有机生活'].includes(x.type) || Math.random()>0.3);
    }
    aiTopicDaily = shuffle(pool).slice(0,6);
    aiDailyDate = today;
  }
  return aiTopicDaily;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function runAIGeneration(taskId){
  const task = state.tasks.find(t=>t.id===taskId);
  if(!task) return;
  task.genStep = 0;
  task.genMsg = '准备生成…';
  task.status='ai_gen';
  task.drafts = task.drafts||{};
  render();

  const sku = (task.skus&&task.skus[0])?task.skus[0]:'全家套装';
  const topicType = task.type||'成分科普';
  const keywords = (task.keywords&&task.keywords.length)?task.keywords.join('、'):'';
  const useLLM = aiConfigured();
  const providerName = useLLM ? (AI_PROVIDERS[state.config.ai.provider].name) : '离线模板';

  for(let pi=0; pi<task.plats.length; pi++){
    const p = task.plats[pi];
    const pName = (PLATFORMS.find(x=>x.key===p)||{name:p}).name;
    task.genStep = pi+1;
    task.genMsg = `${useLLM?'🤖 请求':'📝 模板生成'} ${pName} 母稿 (${pi+1}/${task.plats.length})…`;
    schedulePush();render();
    try{
      let draft;
      if(useLLM){
        let sysPrompt, userPrompt;
        if(state.config.ai.provider==='coze'){
          // 扣子Bot自带知识库，system只传平台风格+格式，产品知识Bot自己有
          sysPrompt = `请生成${pName}内容。\n${PLATFORM_STYLE[p]||PLATFORM_STYLE.xhs}\n\n输出严格JSON格式：{"titles":["标题1","标题2","标题3"],"body":"正文","tags":["#标签1","#标签2"]}，不要代码块不要多余文字。`;
          userPrompt = `【选题】${task.title}\n【内容类型】${topicType}\n【主推SKU】${sku}\n【关键词】${keywords||'根据SKU判断'}\n【备注】${task.remark||'无'}\n\n请根据以上信息，结合你掌握的ECO品牌知识库，创作1篇符合${pName}平台调性的内容母稿。`;
        }else{
          // 豆包/DeepSeek兜底：最小提示+平台风格，产品知识不在提示里（避免双写）
          sysPrompt = MIN_SYS_PROMPT + '\n\n' + (PLATFORM_STYLE[p]||PLATFORM_STYLE.xhs);
          userPrompt = `请为ECO德国有机洗护品牌创作1篇${pName}内容。\n选题：${task.title}\n类型：${topicType}\nSKU：${sku}\n关键词：${keywords||''}\n备注：${task.remark||''}\n\n输出JSON。`;
        }
        const raw = await callAI(sysPrompt, userPrompt);
        draft = parseDraftResponse(raw, p);
        if(!draft) throw new Error('AI返回解析失败');
      }else{
        await new Promise(r=>setTimeout(r,300));
        const topicObj = {title:task.title,type:topicType,keywords:task.keywords||[]};
        draft = generateDraft(topicObj, sku, p);
        draft._offline = true;
      }
      task.drafts[p] = draft;
    }catch(err){
      console.warn(`[${p}]生成失败:`,err);
      const topicObj = {title:task.title,type:topicType,keywords:task.keywords||[]};
      const fb = generateDraft(topicObj, sku, p);
      fb._offline = true;
      fb._errMsg = err.message;
      task.drafts[p] = fb;
      toast(`⚠️ ${pName}生成失败，用模板兜底：${(err.message||'').slice(0,50)}`,'warn',5000);
    }
    schedulePush();
    render();
  }

  task.status='draft';
  task.genStep = task.plats.length+1;
  task.genMsg = '生成完成';
  activePlatTab[taskId] = task.plats[0];
  const hasReal = Object.values(task.drafts).some(d=>!d._offline);
  addLog('叁衍', hasReal
    ? `🤖 ${providerName}生成了「${task.title}」的${task.plats.length}份母稿`
    : `📝 模板生成了「${task.title}」的${task.plats.length}份母稿（未配置AI）`);
  schedulePush();
  render();
  toast(hasReal?'🤖 AI母稿生成完成，请微调':'📝 已用离线模板（去「账号&协作」配扣子Bot启用真AI）', hasReal?'ok':'warn',6000);
}

function renderKCard(t, col){
  const platDots = t.plats.map(p=>{
    const pl=PLATFORMS.find(x=>x.key===p);
    return pl?`<span class="tag" style="background:${pl.color};width:18px;text-align:center;padding:2px 0">${pl.name[0]}</span>`:'';
  }).join('');
  const owner = PERSONS.find(p=>p.name===t.owner);
  const ownerClr = owner?owner.color:'#999';
  const ownerCh = t.owner?t.owner[0]:'?';
  const tags = (t.keywords||[]).slice(0,3).map(k=>`<span class="tag kw">${k}</span>`).join('');
  const isDemo = t.title.includes('【演示】');
  const isGen = t.status==='ai_gen';
  let statusIco = '';
  if(isGen) statusIco='<span class="status-icon">⏳</span>';
  else if(t.status==='review') statusIco='👁️';
  else if(t.status==='publish') statusIco='🕐';
  else if(t.status==='data' && t.data) statusIco='📊';
  else if(t.status==='done') statusIco='✅';
  else if(t.status==='compliance'){
    const c=t.compliance; const all=c.banned&&c.sensitive&&c.tagOpt&&c.platRule&&c.medClaim;
    statusIco = all?'✅':'⚠️';
  }else if(t.status==='split'){
    const done=(t.splits||[]).filter(s=>s.done).length;
    const total=(t.splits||[]).length||0;
    statusIco = total?`<span style="font-size:11px">${done}/${total}</span>`:'🔄';
  }else if(t.status==='media'){
    const done=(t.media||[]).filter(m=>m.done).length;
    const total=(t.media||[]).length||0;
    statusIco = total?`<span style="font-size:11px">${done}/${total}</span>`:'📸';
  }else if(t.status==='draft'){
    const draftDone = Object.values(t.drafts||{}).filter(d=>d.done).length;
    const total = Object.keys(t.drafts||{}).length||0;
    statusIco = total?`<span style="font-size:11px">${draftDone}/${total}</span>`:'✏️';
  }
  // v3.9: cards always compact; details open in right drawer
  const isActive = activeTaskId===t.id;
  return `<div class="kcard ${isDemo?'demo':''} ${isGen?'generating':''} ${isActive?'active-card':''}" style="border-left-color:${col.color}" onclick="openTaskDrawer('${t.id}')">
    <div class="kcard-title">${isDemo?'<span class="demo-tag">演示</span>':''}${t.title}</div>
    <div class="kcard-meta">${platDots}<span class="avatar" style="background:${ownerClr}">${ownerCh}</span></div>
    <div class="kcard-tags">${tags}</div>
    <div class="kcard-foot">
      <span class="last-by" title="${t.lastBy} ${t.lastTime?relTime(t.lastTime):''}">${t.lastBy||''} · ${t.lastTime?relTime(t.lastTime):''}</span>
      ${statusIco}
    </div>
  </div>`;
}

function openTaskDrawer(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const wasOpen = drawerOpen && activeTaskId===id;  // already opening same task?
  activeTaskId = id;
  drawerOpen = true;
  if(!activePlatTab[id] && t.plats && t.plats.length) activePlatTab[id] = t.plats[0];
  render();
  if(!wasOpen){
    // first open: start hidden then add .show to trigger slide-in animation
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        const ov = document.getElementById('drawerOverlay');
        const dw = document.getElementById('taskDrawer');
        if(ov) ov.classList.add('show');
        if(dw) dw.classList.add('show');
      },20);
    });
  }

function closeTaskDrawer(){
  const ov = document.getElementById('drawerOverlay');
  const dw = document.getElementById('taskDrawer');

// v3.2 裂变AI生成引擎
async function aiGenerateSplit(taskId,i){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const s = t.splits[i];
  const pl = PLATFORMS.find(x=>x.key===s.plat);
  const pName = pl?pl.name:s.plat;
  const mainDraft = t.drafts[s.plat] || Object.values(t.drafts||{})[0];
  if(!mainDraft){ toast('请先生成母稿','warn'); return; }
  const mainTitle = mainDraft.customTitle || (mainDraft.titles&&mainDraft.titles[mainDraft.selectedTitle||0]) || t.title;
  const mainBody = mainDraft.body || '';
  const sku = (t.skus&&t.skus[0])||'ECO洗护';
  const type = s.type;

  s._generating = true;
  render();

  try{
    let content = '';
    if(aiConfigured()){
      let sysPrompt, userPrompt;
      const styleGuide = PLATFORM_STYLE[s.plat]||PLATFORM_STYLE.xhs;
      if(state.config.ai.provider==='coze'){
        sysPrompt = `请基于已有的母稿内容，衍生创作一份【${type}】。${styleGuide}\n直接输出衍生内容文本，不要JSON、不要代码块。`;
        userPrompt = `【母稿标题】${mainTitle}\n【母稿正文】${mainBody.slice(0,1500)}\n【衍生类型】${type}\n【平台】${pName}\n【SKU】${sku}\n【账号名】${s.accountName||'矩阵小号'}\n\n请基于母稿核心卖点，创作一份${type}，要求保持核心卖点不变但表达/角度/开头/语气做差异化，避免查重。`;
      }else{
        sysPrompt = MIN_SYS_PROMPT + '\n\n' + styleGuide + '\n\n直接输出衍生内容文本，不要JSON不要代码块。';
        userPrompt = `基于以下母稿，衍生创作一份【${type}】内容（平台：${pName}，账号：${s.accountName||'小号'}）。保持卖点不变，做差异化改写避免查重。\n\n母稿标题：${mainTitle}\n母稿正文：${mainBody.slice(0,1200)}\n\nSKU：${sku}\n\n直接输出生成内容。`;
      }
      content = await callAI(sysPrompt, userPrompt);
    }else{
      // 离线兜底：保留原有简单模板
      await new Promise(r=>setTimeout(r,200));
      content = offlineSplitFallback(type, pName, mainTitle, mainBody, sku, s.accountName||'小号');
      s._offline = true;
    }
    s.content = content;
    s.aiGen = true;
    s.done = true;
    s._generating = false;
    s._time = Date.now();
    schedulePush();
    render();
    toast(`${type}已生成`,'ok');
  }catch(err){
    s._generating = false;
    render();
    console.warn('裂变生成失败:',err);
    // 降级离线
    s.content = offlineSplitFallback(type, pName, mainTitle, mainBody, sku, s.accountName||'小号');
    s.aiGen = true; s.done = true; s._offline = true; s._errMsg = err.message;
    schedulePush(); render();
    toast(`${type}AI生成失败，用模板兜底：${(err.message||'').slice(0,40)}`,'warn',4000);
  }
}

async function aiGenerateAllSplits(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const pending = (t.splits||[]).map((s,i)=>({s,i})).filter(x=>!x.s.aiGen||!x.s.content);
  toast(`开始批量生成${pending.length}条裂变内容…`,'ok');
  for(const {i} of pending){
    await aiGenerateSplit(taskId,i);
    await new Promise(r=>setTimeout(r,300));
  }
  toast('全部裂变内容已生成','ok');
}

  t.splits[i].content = '';

function passSplitCheck(taskId){
  const t = state.tasks.find(x=>x.id===taskId);

  const ungenerated = (t.splits||[]).filter(s=>!s.aiGen||!s.content);
  const undone = (t.splits||[]).filter(s=>!s.done);

function saveComplianceRule(field,val){

function saveComplianceReplaceMap(val){

function getAllTaskSegments(t){
  // 返回带元信息的分段文本数组，每段含 getter/setter 用于精确定位+回写
  const segs = [];
  const add = (plat, part, platKey, field, splitIdx, text, getter, setter)=>{
    segs.push({plat, part, platKey, field, splitIdx, text:text||'', get:getter, set:setter});
  };
  // 选题标题/brief
  add('选题','标题','','title',-1, t.title||'', ()=>t.title, (v)=>t.title=v);
  add('选题','简介','','brief',-1, t.brief||'', ()=>t.brief||'', (v)=>t.brief=v);
  // 各平台母稿
  Object.entries(t.drafts||{}).forEach(([pk,d])=>{
    const pl = PLATFORMS.find(x=>x.key===pk);
    const pname = pl?pl.name:pk;
    // 当前选中标题
    const getCurTitle = ()=>{
      if(d.customTitle) return d.customTitle;
      if(d.selectedTitle>=0 && d.titles && d.titles[d.selectedTitle]) return d.titles[d.selectedTitle];
      return d.titles && d.titles[0] ? d.titles[0] : '';
    };
    const setCurTitle = (v)=>{ if(d.customTitle||d.selectedTitle===-1) d.customTitle=v; else if(d.selectedTitle>=0 && d.titles) d.titles[d.selectedTitle]=v; else if(d.titles && d.titles[0]) d.titles[0]=v; };
    add(pname,'标题',pk,'title',-1, getCurTitle(), getCurTitle, setCurTitle);
    add(pname,'正文',pk,'body',-1, d.body||'', ()=>d.body||'', (v)=>d.body=v);
    (d.tags||[]).forEach((tg,ti)=>{
      add(pname,'标签',pk,'tags',ti, tg, ()=>d.tags[ti], (v)=>d.tags[ti]=v);
    });
  });
  // 裂变内容
  (t.splits||[]).forEach((s,si)=>{
    const pl = PLATFORMS.find(x=>x.key===(s.plat||''));
    const pname = pl?pl.name:(s.plat||'通用');
    add(pname, '裂变-'+(s.type||''), s.plat||'', 'content', si, s.content||'', ()=>s.content||'', (v)=>s.content=v);
  });
  return segs;
}

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function aiScanCompliance(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const rules = state.config.complianceRules || {};
  const segs = getAllTaskSegments(t);
  const hits = {banned:[], sensitive:[], medClaim:[], tagIssue:'', details:[]};
  const findInSeg = (seg, words, type)=>{
    const txt = seg.get()||'';
    words.forEach(w=>{
      if(!w) return;
      const re = new RegExp(escapeRegExp(w),'g');
      let m;
      while((m=re.exec(txt))!==null){
        hits.details.push({
          word: w,
          type: type,
          plat: seg.plat,
          part: seg.part,
          field: seg.field,
          platKey: seg.platKey,
          splitIdx: seg.splitIdx,
          segIdx: hits.details.length,  // will be reindexed after
          pos: m.index,
          replaceTo: type==='sensitive' ? (rules.replaceMap&&rules.replaceMap[w]||'') : ''
        });
        if(type==='banned' && !hits.banned.includes(w)) hits.banned.push(w);
        if(type==='sensitive' && !hits.sensitive.includes(w)) hits.sensitive.push(w);
        if(type==='medClaim' && !hits.medClaim.includes(w)) hits.medClaim.push(w);
        if(m[0].length===0) break;
      }
    });
  };
  segs.forEach((seg,si)=>{
    // segIdx needs to be real index
    findInSeg(seg, rules.banned||[], 'banned');
    findInSeg(seg, rules.sensitive||[], 'sensitive');
    findInSeg(seg, rules.medClaim||[], 'medClaim');
  });
  // 重新按顺序分配segIdx
  hits.details.forEach((h,i)=>{
    // 定位到正确的seg：因为findInSeg里是按segs顺序遍历的，但我们需要重新关联segIdx
    // 简化：重新扫描，用更直接的方法：
  });
  // 重写details：单遍扫描确保segIdx正确
  hits.details = [];
  hits.banned = [];
  hits.sensitive = [];
  hits.medClaim = [];
  segs.forEach((seg,si)=>{
    const txt = seg.get()||'';
    const scanWords = (words, type)=>{
      words.forEach(w=>{
        if(!w) return;
        const re = new RegExp(escapeRegExp(w),'g');
        let m;
        while((m=re.exec(txt))!==null){
          hits.details.push({
            word: w, type, plat: seg.plat, part: seg.part, field: seg.field,
            platKey: seg.platKey, splitIdx: seg.splitIdx, segIdx: si, pos: m.index,
            replaceTo: type==='sensitive' ? (rules.replaceMap&&rules.replaceMap[w]||'') : ''
          });
          if(type==='banned' && !hits.banned.includes(w)) hits.banned.push(w);
          if(type==='sensitive' && !hits.sensitive.includes(w)) hits.sensitive.push(w);
          if(type==='medClaim' && !hits.medClaim.includes(w)) hits.medClaim.push(w);
          if(m[0].length===0) break;
        }
      });
    };
    scanWords(rules.banned||[], 'banned');
    scanWords(rules.sensitive||[], 'sensitive');
    scanWords(rules.medClaim||[], 'medClaim');
  });
  // 标签检查
  const allTags = [];
  Object.values(t.drafts||{}).forEach(d=>{ if(d.tags) allTags.push(...d.tags); });
  if(allTags.length > (rules.tagRules?.maxTags||10)) hits.tagIssue = `标签数${allTags.length}超过建议上限${rules.tagRules.maxTags}`;
  (rules.tagRules?.banned||[]).forEach(w=>{ if(allTags.some(tg=>tg.includes(w))) hits.tagIssue = (hits.tagIssue?hits.tagIssue+';':'')+`标签含禁用词"${w}"`; });
  t.compliance.scanned = true;
  t.compliance.scanTime = Date.now();
  t.compliance.hits = hits;
  t.compliance.banned = hits.banned.length===0;
  t.compliance.sensitive = hits.sensitive.length===0;
  t.compliance.medClaim = hits.medClaim.length===0;
  t.compliance.tagOpt = !hits.tagIssue;
  t.compliance.platRule = true;
  schedulePush();
  render();
  const total = hits.details.length + (hits.tagIssue?1:0);
  if(total===0) toast('AI扫描完成：全部合规 ✅','ok');
  else toast(`AI扫描完成：发现${hits.details.length}处违规，可一键合规或逐条改写`,'warn');
}

function applyWordReplace(seg, word, replaceTo){
  // 在seg文本中把word替换为replaceTo；replaceTo为空时移除
  const txt = seg.get()||'';
  const re = new RegExp(escapeRegExp(word),'g');
  let newTxt;
  if(replaceTo){
    newTxt = txt.replace(re, replaceTo);
    // 修复替换后可能产生的粘连空格
    newTxt = newTxt.replace(/\s{2,}/g,' ');
  }else{
    // 移除该词：智能清理前后空格/标点，避免留下"，，"、"  ，"等
    newTxt = txt.replace(re, (m, pos, full)=>{
      // 检查前后字符，决定是否连带删除紧邻标点或空格
      let before = pos>0 ? full[pos-1] : '';
      let after = pos+m.length < full.length ? full[pos+m.length] : '';
      // 词后紧跟标点（，。！？、；：,.:;!?）则连带删标点
      if(/[，。！？、；：,.:;!?]/.test(after)){
        // 需要同时删该标点：通过在匹配后扩展——这里简单返回空，后续用正则清理
      }
      return '';
    });
    // 清理多余空格
    newTxt = newTxt.replace(/\s{2,}/g,' ');
    // 清理连续/前置/后置标点
    newTxt = newTxt.replace(/[，。！？、；：,.:;!?]{2,}/g, (m)=>m[0]);
    newTxt = newTxt.replace(/^[\s，。！？、；：,.:;!?]+|[\s，。！？、；：,.:;!?]+$/g,'');
    newTxt = newTxt.replace(/\s+([，。！？、；：,.:;!?])/g,'$1');
  }
  seg.set(newTxt);
}

function quickFixHit(taskId, hitIdx){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t||!t.compliance||!t.compliance.hits||!t.compliance.hits.details) return;
  const h = t.compliance.hits.details[hitIdx];
  if(!h) return;
  const segs = getAllTaskSegments(t);
  const seg = segs[h.segIdx];
  if(!seg) return;
  const replaceTo = h.type==='sensitive' ? (h.replaceTo||'') : '';
  applyWordReplace(seg, h.word, replaceTo);
  toast(replaceTo?`已替换为"${replaceTo}"`:`已移除"${h.word}"`,'ok');
  // 重新扫描
  aiScanCompliance(taskId);
}

function oneClickFixAll(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t||!t.compliance||!t.compliance.hits||!t.compliance.hits.details) return;
  const rules = state.config.complianceRules || {};
  const segs = getAllTaskSegments(t);
  // 按seg分组处理，避免重复替换
  const bySeg = {};
  t.compliance.hits.details.forEach(h=>{
    const key = h.segIdx;
    if(!bySeg[key]) bySeg[key] = [];
    bySeg[key].push(h);
  });
  let fixCount = 0;
  Object.entries(bySeg).forEach(([si, hits])=>{
    const seg = segs[+si];
    if(!seg) return;
    // 先收集该段所有替换（敏感词用replaceMap，违禁/医疗直接移除）
    // 多次替换注意：先处理长词，避免短词误伤
    hits.sort((a,b)=>b.word.length-a.word.length);
    hits.forEach(h=>{
      const replaceTo = h.type==='sensitive' ? (rules.replaceMap&&rules.replaceMap[h.word]||'') : '';
      applyWordReplace(seg, h.word, replaceTo);
      fixCount++;
    });
  });
  toast(`⚡ 一键合规完成，共处理${fixCount}处，请复核上下文通顺度`,'ok');
  aiScanCompliance(taskId);
}

function openManualFix(taskId, hitIdx){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t||!t.compliance||!t.compliance.hits||!t.compliance.hits.details) return;
  const h = t.compliance.hits.details[hitIdx];
  if(!h) return;
  const segs = getAllTaskSegments(t);
  const seg = segs[h.segIdx];
  if(!seg) return;
  const fullText = seg.get()||'';
  window._fixCtx = {taskId, hitIdx, seg, word:h.word, replaceTo:h.replaceTo||'', plat:h.plat, part:h.part};
  document.getElementById('mfWord').textContent = h.word;
  document.getElementById('mfPlat').textContent = `${h.plat} · ${h.part}`;
  // 高亮违规词
  const re = new RegExp('('+escapeRegExp(h.word)+')','g');
  const highlighted = fullText.replace(re,'<mark>$1</mark>');
  // textarea里不能放HTML，直接放纯文本，选中word
  const area = document.getElementById('manualFixArea');
  area.value = fullText;

}

function closeManualFix(){

}

function applySuggestion(){

function aiAutoReplaceCompliance(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const rules = state.config.complianceRules;
  const replaceMap = rules.replaceMap||{};
  let replaced = 0;
  Object.values(t.drafts||{}).forEach(d=>{
    if(d.body){
      Object.entries(replaceMap).forEach(([k,v])=>{
        const re = new RegExp(k,'g');
        const n = (d.body.match(re)||[]).length;
        if(n>0){ d.body = d.body.replace(re,v); replaced += n; }
      });
    }
    if(d.titles){
      d.titles = d.titles.map(tl=>{
        let nt = tl;
        Object.entries(replaceMap).forEach(([k,v])=>{ nt = nt.replace(new RegExp(k,'g'),v); });
        return nt;
      });
    }
  });
  (t.splits||[]).forEach(s=>{
    if(s.content){
      Object.entries(replaceMap).forEach(([k,v])=>{
        const re = new RegExp(k,'g');
        const n = (s.content.match(re)||[]).length;
        if(n>0){ s.content = s.content.replace(re,v); replaced += n; }
      });
    }
  });
  toast(`已自动替换${replaced}处敏感词，请重新扫描验证`,'ok');
  // 自动重新扫描
  setTimeout(()=>aiScanCompliance(taskId), 300);
}
function passComplianceCheck(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  if(!t.compliance.scanned){ toast('请先点🤖AI自动扫描合规','warn'); return; }
  const hits = t.compliance.hits||{};
  const details = hits.details||[];
  const remainBanned = details.filter(d=>d.type==='banned').length;
  const remainMed = details.filter(d=>d.type==='medClaim').length;
  const remainSens = details.filter(d=>d.type==='sensitive').length;
  if(remainBanned>0){ toast(`还有${remainBanned}处违禁词未处理，请逐条改写或点一键合规`,'warn'); return; }
  if(remainMed>0){ toast(`还有${remainMed}处医疗宣称词未处理，请逐条改写或点一键合规`,'warn'); return; }
  if(remainSens>0){
    if(!confirm(`还有${remainSens}处敏感/功效词，已确认人工处理好并继续？`)) return;
  }
  passCompliance(taskId);
}

/* ========== v3.5 AI配图系统（中文提示词+多物料项激活+重试+负面提示词） ========== */
function matchProductsForTask(t){
  let text = (t.title||'') + ' ';
  (t.tags||[]).forEach(tg=>{text+=tg+' ';});
  Object.values(t.drafts||{}).forEach(d=>{
    if(!d) return;
    (d.titles||[]).forEach(tl=>text+=(tl||'')+' ');
    text += (d.body||'')+' ';
  });
  text = text.toLowerCase();
  const scored = ECO_PRODUCTS.map(p=>{
    let score = 0;
    p.kws.forEach(k=>{ if(text.includes(k.toLowerCase())) score++; });
    return {...p, matchScore: score};
  });
  scored.sort((a,b)=>b.matchScore - a.matchScore);
  return scored;
}

}

function getActiveMatKey(t){

    return m.id || `mat_${t._activeMatIdx}`;

  const undone = t.media.findIndex(m=>!m.done);

function getActiveMatName(t){

  const t = state.tasks.find(x=>x.id===taskId);

  if(t.images[key] && t.images[key].productId===productId && t.images[key].type==='rec'){
    delete t.images[key];
    // v3.8 取消图片时该物料项回到未完成
    if(t.media && t.media[t._activeMatIdx] && !t.images[key]) t.media[t._activeMatIdx].done=false;

  }else{
    t.images[key] = {type:'rec', productId, url:prod.img, name:prod.name, time:Date.now()};

    if(t.media && t.media[t._activeMatIdx]) t.media[t._activeMatIdx].done = true;

  }
  schedulePush(); render();
}

function zhToEnPrompt(zhText, info){
